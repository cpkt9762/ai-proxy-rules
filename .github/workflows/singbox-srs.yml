name: Build Sing-Box Domain & SRS

on:
  push:
    branches:
      - main
    paths:
      - "data/providers/**"
      - "rules/sing-box/*.json"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/actions/setup-sing-box/**"
      - ".github/workflows/singbox-srs.yml"
  pull_request:
    paths:
      - "data/providers/**"
      - "rules/sing-box/*.json"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/actions/setup-sing-box/**"
      - ".github/workflows/singbox-srs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-singbox-srs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm generate -f sing-box,sing-box-domain,sing-box-ip
      - uses: ./.github/actions/setup-sing-box
        with:
          token: ${{ github.token }}
      - run: pnpm compile:srs
      - name: Verify compiled domain SRS rule-sets
        run: |
          sing-box rule-set match -f binary rules/sing-box-domain/anthropic.srs api.anthropic.com
          node -e '
            const fs = require("fs");
            for (const dir of ["rules/sing-box-domain", "rules/sing-box-ip"]) {
              for (const f of fs.readdirSync(dir).filter((x) => x.endsWith(".json"))) {
                const j = JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8"));
                const srs = `${dir}/${f.replace(/\.json$/, ".srs")}`;
                if (!fs.existsSync(srs)) throw new Error(`Missing SRS: ${srs}`);
                for (const r of j.rules) {
                  for (const k of Object.keys(r)) {
                    if (dir.endsWith("domain") && !["domain", "domain_suffix", "domain_keyword", "domain_regex"].includes(k)) {
                      throw new Error(`${dir}/${f} contains non-domain key: ${k}`);
                    }
                    if (dir.endsWith("ip") && k !== "ip_cidr") {
                      throw new Error(`${dir}/${f} contains non-IP key: ${k}`);
                    }
                  }
                }
              }
            }
            console.log("Verified all sing-box-domain and sing-box-ip JSON + SRS files");
          '
      - name: Commit sing-box domain, IP and SRS rules
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/sing-box rules/sing-box-domain rules/sing-box-ip
          if git diff --cached --quiet; then
            echo "No sing-box rule or .srs changes"
          else
            git commit -m "chore(sing-box): build domain/ip rule-sets and .srs binaries"
            git push
          fi
